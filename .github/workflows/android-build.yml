name: Wafa QuickEats ⚡ Android Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Restore Keystore from Secrets (If available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Validate & Copy Debug APK
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Debug APK was not generated!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Debug APK size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "❌ ERROR: APK is suspiciously small (< 1 MB). Size: $FILE_SIZE bytes"
            exit 1
          fi

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          echo "✅ Successfully copied APK to .build-outputs/app-debug.apk and APK_DOWNLOAD/app-debug.apk"
          ls -lh .build-outputs/app-debug.apk

      - name: Build Release Bundle (AAB) if signing configured
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -f "my-upload-key.jks" ]; then
            echo "Building Release AAB..."
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            if [ -f "./gradlew" ]; then
              ./gradlew :app:bundleRelease
            else
              gradle :app:bundleRelease
            fi
            cp app/build/outputs/bundle/release/*.aab .build-outputs/app-release.aab || true
          else
            echo "Signing secrets not present. Skipping release bundle signing."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafa-quickeats-debug-apk
          path: .build-outputs/app-debug.apk
          if-no-files-found: error

      - name: Upload Release Artifacts (If generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafa-quickeats-release-outputs
          path: .build-outputs/
